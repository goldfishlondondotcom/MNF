<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MNF Team News</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div class="bg"><div class="bg-photo"></div><div class="bg-tint"></div></div>
    <div class="streaks"></div>

    <section id="intro" class="scene">
      <div class="intro-title">
        <div class="line line1"><span>Monday Night</span></div>
        <div class="bar"></div>
        <div class="line line2"><span>Football</span></div>
      </div>
      <div class="strip"></div>
      <div class="tag">Team News</div>
    </section>

    <!-- team scenes are built by app.js -->

    <section id="vs" class="scene">
      <div class="vs-side vs-left"><div class="vs-name"></div><div class="vs-list"></div></div>
      <div class="vs-side vs-right"><div class="vs-name"></div><div class="vs-list"></div></div>
      <div class="vs-mid">VS</div>
      <div class="vs-strip"></div>
    </section>

    <div class="wipe"><i></i><i></i><i></i></div>
    <div class="blackout"></div>
  </div>
  <div class="hint">Press space to replay</div>

  <script src="vendor/gsap.min.js"></script>
  <script src="lineup.js"></script>
  <script src="app.js"></script>
</body>
</html>
